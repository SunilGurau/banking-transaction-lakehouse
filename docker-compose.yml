services:
  minio:
    image: minio/minio:latest
    container_name: lakehouse_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped


  mc-init:
    image: minio/mc:latest
    container_name: mc-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin123 &&
      mc mb -p local/warehouse &&
      mc mb -p local/delta-tables &&
      mc mb -p local/bronze &&
      mc mb -p local/silver &&
      mc mb -p local/gold &&
      echo 'Buckets ready' &&
      exit 0
      "

  spark-thrift:
    build:
      context: ./spark
      dockerfile: Dockerfile
    container_name: spark-thrift
    depends_on:
      minio:
        condition: service_healthy
      mc-init:
        condition: service_completed_successfully
    ports:
      - "10000:10000" # Thrift JDBC/ODBC
      - "4040:4040" # Spark UI
    hostname: spark-thrift
    restart: unless-stopped

  jupyter:
    image: jupyter/pyspark-notebook:spark-3.5.0
    container_name: jupyter
    environment:
      - JUPYTER_ENABLE_LAB=yes
      - JUPYTER_TOKEN=minioadmin
    ports:
      - "8888:8888"
    volumes:
      - ./notebooks:/home/jovyan/work
    depends_on:
      minio:
        condition: service_healthy
    restart: unless-stopped

  airflow-postgres:
    image: postgres:16
    container_name: airflow_metadata_postgres
    environment:
      POSTGRES_USER: ${AIRFLOW_METADATA_DB_USER:-airflow}
      POSTGRES_PASSWORD: ${AIRFLOW_METADATA_DB_PASSWORD:-airflow}
      POSTGRES_DB: ${AIRFLOW_METADATA_DB_NAME:-airflow}
    volumes:
      - airflow_metadata_db:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${AIRFLOW_METADATA_DB_USER:-airflow} -d ${AIRFLOW_METADATA_DB_NAME:-airflow} -h localhost",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  etl-postgres:
    image: postgres:16
    container_name: etl_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-etl_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-etl_password}
      POSTGRES_DB: ${POSTGRES_DB:-etl_db}
    ports:
      - "5433:5432"
    volumes:
      - etl_postgres_data:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-etl_user} -d ${POSTGRES_DB:-etl_db} -h localhost",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  airflow-init:
    build: .
    container_name: airflow_init
    depends_on:
      minio:
        condition: service_started
      airflow-postgres:
        condition: service_healthy
      etl-postgres:
        condition: service_healthy
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_METADATA_DB_USER:-airflow}:${AIRFLOW_METADATA_DB_PASSWORD:-airflow}@airflow-postgres:5432/${AIRFLOW_METADATA_DB_NAME:-airflow}
      AIRFLOW__CORE__FERNET_KEY: ""
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__API__AUTH_BACKENDS: "airflow.api.auth.backend.basic_auth"
      POSTGRES_USER: ${POSTGRES_USER:-etl_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-etl_password}
      POSTGRES_DB: ${POSTGRES_DB:-etl_db}
      POSTGRES_HOST: ${POSTGRES_HOST:-etl-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://minio:9000}
      MINIO_BUCKET: ${MINIO_BUCKET:-banking-lakehouse}
      MINIO_REFERENCE_PREFIX: ${MINIO_REFERENCE_PREFIX:-raw/reference}
      MINIO_REGION: ${MINIO_REGION:-us-east-1}
      MINIO_AWS_CONN_ID: ${MINIO_AWS_CONN_ID:-minio}
      AIRFLOW_CONN_MINIO: "aws://${MINIO_ROOT_USER:-minioadmin}:${MINIO_ROOT_PASSWORD:-minioadmin123}@/?endpoint_url=http%3A%2F%2Fminio%3A9000&region_name=us-east-1"
      SPARK_MASTER_URL: ${SPARK_MASTER_URL:-spark://spark-master:7077}
      SPARK_THRIFTSERVER_HOST: ${SPARK_THRIFTSERVER_HOST:-spark-thrift}
      SPARK_THRIFTSERVER_PORT: ${SPARK_THRIFTSERVER_PORT:-10000}
      SPARK_WAREHOUSE_DIR: ${SPARK_WAREHOUSE_DIR:-s3a://banking-lakehouse/spark-warehouse}
    volumes:
      - ./dags:/opt/airflow/dags
      - ./data:/opt/airflow/data
      - ./logs:/opt/airflow/logs
      - ./src:/opt/airflow/src
      - ./plugins:/opt/airflow/plugins
      - ./dbt:/opt/airflow/dbt
    command: >
      bash -c "
      airflow db migrate &&
      airflow users create
      --username ${AIRFLOW_ADMIN_USERNAME:-airflow}
      --password ${AIRFLOW_ADMIN_PASSWORD:-airflow}
      --firstname ${AIRFLOW_ADMIN_FIRSTNAME:-Airflow}
      --lastname ${AIRFLOW_ADMIN_LASTNAME:-Admin}
      --role Admin
      --email ${AIRFLOW_ADMIN_EMAIL:-airflow@example.com}
      "
    restart: "no"

  airflow-webserver:
    build: .
    container_name: airflow_webserver
    depends_on:
      minio:
        condition: service_started
      airflow-init:
        condition: service_completed_successfully
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_METADATA_DB_USER:-airflow}:${AIRFLOW_METADATA_DB_PASSWORD:-airflow}@airflow-postgres:5432/${AIRFLOW_METADATA_DB_NAME:-airflow}
      AIRFLOW__CORE__FERNET_KEY: ""
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
      AIRFLOW__API__AUTH_BACKENDS: "airflow.api.auth.backend.basic_auth"
      POSTGRES_USER: ${POSTGRES_USER:-etl_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-etl_password}
      POSTGRES_DB: ${POSTGRES_DB:-etl_db}
      POSTGRES_HOST: ${POSTGRES_HOST:-etl-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://minio:9000}
      MINIO_BUCKET: ${MINIO_BUCKET:-banking-lakehouse}
      MINIO_REFERENCE_PREFIX: ${MINIO_REFERENCE_PREFIX:-raw/reference}
      MINIO_REGION: ${MINIO_REGION:-us-east-1}
      MINIO_AWS_CONN_ID: ${MINIO_AWS_CONN_ID:-minio}
      AIRFLOW_CONN_MINIO: "aws://${MINIO_ROOT_USER:-minioadmin}:${MINIO_ROOT_PASSWORD:-minioadmin123}@/?endpoint_url=http%3A%2F%2Fminio%3A9000&region_name=us-east-1"
      SPARK_MASTER_URL: ${SPARK_MASTER_URL:-spark://spark-master:7077}
      SPARK_THRIFTSERVER_HOST: ${SPARK_THRIFTSERVER_HOST:-spark-thrift}
      SPARK_THRIFTSERVER_PORT: ${SPARK_THRIFTSERVER_PORT:-10000}
      SPARK_WAREHOUSE_DIR: ${SPARK_WAREHOUSE_DIR:-s3a://banking-lakehouse/spark-warehouse}
    ports:
      - "8080:8080"
    volumes:
      - ./dags:/opt/airflow/dags
      - ./data:/opt/airflow/data
      - ./logs:/opt/airflow/logs
      - ./src:/opt/airflow/src
      - ./plugins:/opt/airflow/plugins
      - ./dbt:/opt/airflow/dbt
    command: webserver
    restart: unless-stopped

  airflow-scheduler:
    build: .
    container_name: airflow_scheduler
    depends_on:
      minio:
        condition: service_started
      airflow-init:
        condition: service_completed_successfully
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_METADATA_DB_USER:-airflow}:${AIRFLOW_METADATA_DB_PASSWORD:-airflow}@airflow-postgres:5432/${AIRFLOW_METADATA_DB_NAME:-airflow}
      AIRFLOW_CONN_ETL_POSTGRES: postgresql://${POSTGRES_USER:-etl_user}:${POSTGRES_PASSWORD:-etl_password}@etl-postgres:5432/${POSTGRES_DB:-etl_db}
      AIRFLOW__CORE__FERNET_KEY: ""
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__API__AUTH_BACKENDS: "airflow.api.auth.backend.basic_auth"
      POSTGRES_USER: ${POSTGRES_USER:-etl_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-etl_password}
      POSTGRES_DB: ${POSTGRES_DB:-etl_db}
      POSTGRES_HOST: ${POSTGRES_HOST:-etl-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      DBT_PROJECT_DIR: ${DBT_PROJECT_DIR:-/opt/airflow/dbt/banking_analytics}
      DBT_PROFILES_DIR: ${DBT_PROFILES_DIR:-/opt/airflow/dbt}
      DBT_TARGET: spark
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://minio:9000}
      MINIO_BUCKET: ${MINIO_BUCKET:-banking-lakehouse}
      MINIO_REFERENCE_PREFIX: ${MINIO_REFERENCE_PREFIX:-raw/reference}
      MINIO_REGION: ${MINIO_REGION:-us-east-1}
      MINIO_AWS_CONN_ID: ${MINIO_AWS_CONN_ID:-minio}
      AIRFLOW_CONN_MINIO: "aws://${MINIO_ROOT_USER:-minioadmin}:${MINIO_ROOT_PASSWORD:-minioadmin123}@/?endpoint_url=http%3A%2F%2Fminio%3A9000&region_name=us-east-1"
      SPARK_MASTER_URL: ${SPARK_MASTER_URL:-spark://spark-master:7077}
      SPARK_THRIFTSERVER_HOST: ${SPARK_THRIFTSERVER_HOST:-spark-thrift}
      SPARK_THRIFTSERVER_PORT: ${SPARK_THRIFTSERVER_PORT:-10000}
      SPARK_WAREHOUSE_DIR: ${SPARK_WAREHOUSE_DIR:-s3a://banking-lakehouse/spark-warehouse}
    volumes:
      - ./dags:/opt/airflow/dags
      - ./data:/opt/airflow/data
      - ./logs:/opt/airflow/logs
      - ./src:/opt/airflow/src
      - ./plugins:/opt/airflow/plugins
      - ./dbt:/opt/airflow/dbt
    command: scheduler
    restart: unless-stopped

  dashboard:
    build: ./dashboard
    container_name: dashboard
    ports:
      - "8501:8501"
    depends_on:
      - etl-postgres
    restart: unless-stopped

  zookeeper:
      image: confluentinc/cp-zookeeper:7.4.0
      container_name: zookeeper
      environment:
        ZOOKEEPER_CLIENT_PORT: 2181
        ZOOKEEPER_TICK_TIME: 2000
      ports:
        - "2181:2181"
      networks:
        - banking-lakehouse-net

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - banking-lakehouse-net

networks:
  banking-lakehouse-net:
    driver: bridge
    
volumes:
  airflow_metadata_db:
  etl_postgres_data:
  minio_data:
  kafka_data:
  zookeeper_data:
  zookeeper_log:
